name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attach the APK to tagged releases

# 同一分支的新推送会取消进行中的旧构建（tag 构建不取消，保证发版完整）
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.ref || github.head_ref || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.PIIK_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # v2.3.0 的 go.mod 要求 go >= 1.27.3，旧配置 1.26.x 会直接构建失败
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true # 缓存 go modules 与 build cache，引擎重编译大幅提速

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Gradle 依赖缓存（官方 action，只缓存依赖不动构建缓存，安全）
      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      # Piik web UI 的 npm 依赖缓存（依赖在构建时克隆的引擎目录里，
      # 无法按 lockfile 哈希做 key，用固定 key 的下载缓存，内容寻址不会出错）
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-download-cache
          restore-keys: npm-download-cache

      - name: Build Piik engine, capture shim and cloudflared
        run: scripts/build-native.sh

      - name: Release signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.PIIK_KEYSTORE_BASE64 }}
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PIIK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          PIIK_KEYSTORE_PASSWORD: ${{ secrets.PIIK_KEYSTORE_PASSWORD }}
          PIIK_KEY_ALIAS: ${{ secrets.PIIK_KEY_ALIAS }}
          PIIK_KEY_PASSWORD: ${{ secrets.PIIK_KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            # Surface the real errors as annotations (visible without opening raw logs).
            grep -E "^e: |error:|What went wrong|^> |Caused by|FAILED|Exception" gradle.log | grep -v "^> Task" | head -30 | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
          fi
          exit $status

      # APK 文件名带版本号与实际打包的 ABI，避免多版本下载后撞名、
      # 也让人一眼看出这包装在什么架构上。
      - name: Name the APK
        run: |
          version=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          abis=$(unzip -l app/build/outputs/apk/release/app-release.apk \
            | grep -oE 'lib/[^/]+' | cut -d/ -f2 | sort -u | paste -sd+ -)
          [ -n "$version" ] || { echo "::error::could not read versionName"; exit 1; }
          [ -n "$abis" ] || { echo "::error::could not detect ABIs from the APK"; exit 1; }
          name="Piik-Android-richkobe-v${version}-${abis}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"
          echo "APK_VERSION=$version" >> "$GITHUB_ENV"
          echo "APK_ABI=$abis" >> "$GITHUB_ENV"
          echo "APK: $name"

      - uses: actions/upload-artifact@v4
        with:
          name: piik-android-richkobe-${{ env.APK_VERSION }}-${{ env.APK_ABI }}
          path: ${{ env.APK_NAME }}

      # 发版只在打 tag（v*）时进行；日常 push 的 APK 从上方 artifact 下载。
      # 从 CHANGELOG.md 抽取当前 tag 对应的段落作为本次 Release 正文，
      # 这样每次发版只带自己那版日志，而不是把整个历史都贴上去。
      - name: Extract changelog for this tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME}"
          awk -v tag="$tag" '
            $0 == "## " tag { show=1; next }
            show && /^## / { exit }
            show { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-body.md"
          if [ ! -s "$RUNNER_TEMP/release-body.md" ]; then
            echo "::error::CHANGELOG.md has no '## ${tag}' section"
            exit 1
          fi
          echo "已抽取 ${tag} 的更新日志（$(wc -l < "$RUNNER_TEMP/release-body.md") 行）"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Piik Android richkobe ${{ github.ref_name }} (${{ env.APK_ABI }})
          make_latest: true
          body_path: ${{ runner.temp }}/release-body.md
          files: ${{ env.APK_NAME }}
